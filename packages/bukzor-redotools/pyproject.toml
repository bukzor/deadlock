[project]
name = "bukzor-redotools"
version = "0.1.0"
description = "Small companion commands for apenwarr's redo build system."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
redo-adopt = "bukzor_redotools.adopt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukzor_redotools"]
