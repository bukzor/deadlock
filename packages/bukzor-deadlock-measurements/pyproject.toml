[project]
name = "bukzor-deadlock-measurements"
version = "0.0.0"
description = "Measured in-game values of Deadlock that calibrate the evaluator."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bukzor-deadlock",
    "bukzor-deadlock-lookup",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukzor_deadlock_measurements"]

[tool.uv.sources]
bukzor-deadlock = { workspace = true }
bukzor-deadlock-lookup = { workspace = true }
