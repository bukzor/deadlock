[project]
name = "bukzor-deadlock-measurements"
version = "0.0.0"
description = "Hand-recorded sandbox readings of Deadlock, one Python module per experiment over a frozen-dataclass vocabulary, plus the code that checks and reports them."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bukzor-deadlock",
    "bukzor-deadlock-lookup",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukzor_deadlock_measurements"]

[tool.uv.sources]
bukzor-deadlock = { workspace = true }
bukzor-deadlock-lookup = { workspace = true }
