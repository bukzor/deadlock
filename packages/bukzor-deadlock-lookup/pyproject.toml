[project]
name = "bukzor-deadlock-lookup"
version = "0.0.0"
description = "Typed lookup of Deadlock heroes, abilities and items by key or English name."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bukzor-deadlock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukzor_deadlock_lookup"]

[tool.uv.sources]
bukzor-deadlock = { workspace = true }
