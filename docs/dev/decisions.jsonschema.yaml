$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [status, date]
properties:
  status:
    enum: [proposed, accepted, superseded]
  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  supersedes:
    type: string
    description: filename of the decision this one replaces
