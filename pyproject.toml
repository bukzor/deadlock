[project]
name = "bukzor-deadlock"
version = "0.0.0"
description = "Deterministic parsers for inspecting the Deadlock (Source 2) game binary."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "keyvalues3>=0.3",
    "python-typed-json>=0.1.0",
    "bukzor-dllscan",
    "vdf>=3.4",
    "vpk>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "basedpyright-as-pyright",
    "bukzor-redotools",
    "capstone>=5.0.9",
    "black>=26.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukzor_deadlock"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "packages"]
addopts = "-q --doctest-modules"
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

[tool.pyright]
include = ["src", "tests", "packages", "typings"]
pythonVersion = "3.12"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
# third-party container/KV3 libs ship no type stubs; we wrap them at typed boundaries
reportMissingTypeStubs = false
# apps/vis/server is its own uv project (Python 3.14, Starlette), outside
# `include`. An editor that opens one of its files here gets that project's
# packages and Python, so its imports resolve; its own config is the check.
executionEnvironments = [
    { root = "apps/vis/server", pythonVersion = "3.14", extraPaths = ["apps/vis/server/.venv/lib/python3.14/site-packages"] },
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bukzor-dllscan = { workspace = true }
bukzor-redotools = { workspace = true }
basedpyright-as-pyright = { git = "https://github.com/bukzor/basedpyright-as-pyright" }
