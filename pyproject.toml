[project]
name = "deadlock"
version = "0.0.0"
description = "Deterministic parsers for inspecting the Deadlock (Source 2) game binary."
requires-python = ">=3.12"
dependencies = [
    "keyvalues3>=0.3",
    "python-typed-json>=0.1.0",
    "vpk>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "basedpyright-as-pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-q --doctest-modules"
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
# third-party container/KV3 libs ship no type stubs; we wrap them at typed boundaries
reportMissingTypeStubs = false

[tool.uv.sources]
basedpyright-as-pyright = { git = "https://github.com/bukzor/basedpyright-as-pyright" }
