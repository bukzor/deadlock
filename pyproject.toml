[project]
name = "deadlock"
version = "0.0.0"
description = "Deterministic parsers for inspecting the Deadlock (Source 2) game binary."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-q --doctest-modules"
python_classes = ["Describe*"]
python_functions = ["it_*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
