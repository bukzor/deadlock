[project]
name = "vis-server"
version = "0.0.0"
description = "Serve views over the deadlock data/ tree to the vis client, as JSONL."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "bukzor-deadlock",
    "bukzor-deadlock-damage",
    "bukzor-deadlock-lookup",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
vis-server = "vis_server.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vis_server"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
bukzor-deadlock = { path = "../../../", editable = true }
bukzor-deadlock-damage = { path = "../../../packages/bukzor-deadlock-damage", editable = true }
bukzor-deadlock-lookup = { path = "../../../packages/bukzor-deadlock-lookup", editable = true }

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q --doctest-modules"
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
